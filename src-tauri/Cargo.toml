[package]
name = "dynamic-background"
version = "0.4.0"
description = "Fond d'écran dynamique modulaire pour Windows"
authors = ["mathgen44"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dynamic_background_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
feed-rs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "gzip", "brotli", "charset"] }
futures = "0.3"
log = "0.4"
rrule = "0.14.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Performance",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Wdk_Graphics_Direct3D",
  "Win32_System_WinRT",
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
