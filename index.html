<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Background — Éditeur</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/icon.png" alt="" width="22" height="22" />
        <span>Dynamic Background</span>
      </div>
      <div class="tb-group">
        <button id="btn-undo" class="btn-icon" title="Annuler (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button id="btn-redo" class="btn-icon" title="Rétablir (Ctrl+Y)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
        <select id="monitor" hidden title="Écran à prévisualiser"></select>
        <span id="zoom" class="muted small"></span>
      </div>
      <div class="tb-group right">
        <span id="status" class="status"></span>
        <button id="btn-apply" class="btn primary" title="Ctrl+S">Appliquer au bureau</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar left">
        <h2>Briques</h2>
        <div id="palette" class="palette"></div>
        <h2>Calques</h2>
        <div id="layers" class="layers"></div>
        <p id="layers-empty" class="muted small pad">Aucune brique pour l'instant.</p>
      </aside>

      <section id="stage" class="stage">
        <div id="screen" class="screen">
          <div id="board"></div>
          <div id="grid" class="grid-overlay"></div>
          <div id="frames" class="frames"></div>
          <div id="ghost" class="ghost" hidden></div>
        </div>
      </section>

      <aside class="sidebar right">
        <nav class="tabs">
          <button class="tab active" data-tab="widget">Brique</button>
          <button class="tab" data-tab="theme">Thème</button>
          <button class="tab" data-tab="settings">Réglages</button>
        </nav>
        <div id="inspector-body" class="inspector"></div>
      </aside>
    </main>
    <script type="module" src="/src/editor/editor.js"></script>
  </body>
</html>
